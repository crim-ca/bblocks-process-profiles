$schema: https://json-schema.org/draft/2020-12/schema
description: |
  Profile of the OGC API - Processes process description for the deployed Resoterre
  RDPS-to-HRDPS climate downscaling U-Net workflow.
allOf:
  - $ref: bblocks://ogc.api.processes.v1.schemas.process
  - $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
  - type: object
    required: [id, version, inputs, outputs]
    properties:
      id:
        const: ogc-ospd2026-downscaling-unet
      inputs:
        type: object
        required:
          - start_datetime
          - end_datetime
        propertyNames:
          enum:
            - start_datetime
            - end_datetime
            - requires_previous_forecast_step
            - include_year_month_subdirectory
            - data_root
            - config
      outputs:
        type: object
        required: [forecast_files, inference_output]
        propertyNames:
          enum: [forecast_files, inference_output]
$defs:
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.v2.schemas.ogcapppkg
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
