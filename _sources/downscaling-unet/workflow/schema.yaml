$schema: https://json-schema.org/draft/2020-12/schema
description: |
  Profile of the OGC API - Processes process description for the deployed Resoterre
  RDPS-to-HRDPS climate downscaling U-Net workflow.
allOf:
  - $ref: bblocks://ogc.api.processes.v1.schemas.process
  - $ref: bblocks://ogc.api.processes.v2.schemas.staticIndicator
  - type: object
    required: [id, version, inputs, outputs]
    properties:
      id:
        const: ogc-ospd2026-downscaling-unet-workflow
      inputs:
        type: object
        required:
          - start_datetime
          - end_datetime
        propertyNames:
          enum:
            - start_datetime
            - end_datetime
            - requires_previous_forecast_step
            - include_year_month_subdirectory
            - data_root
            - config
      outputs:
        type: object
        required: [forecast_files, inference_output]
        propertyNames:
          enum: [forecast_files, inference_output]
$defs:
  sourceCwl:
    $ref: bblocks://ogc.cwl.v1_2_1.CWLWorkflow
  publishedModel:
    description: |
      Validate the external response's MLM extension content, not full STAC conformance.
      The current API response omits properties.datetime required by STAC Item.
    allOf:
      - $ref: https://stac-extensions.github.io/mlm/v1.6/schema.json
      - type: object
        required: [id, type, properties, geometry, bbox]
        properties:
          id:
            const: ogc-ospd2026-downscaling-unet
          type:
            const: Feature
  execute:
    description: >-
      Execute request using native input values, consistent with the other process profiles.
      The upstream execute schema rejects plain string values (documented register issue U-01).
    type: object
    required: [inputs]
    properties:
      inputs:
        type: object
        required: [start_datetime, end_datetime]
        additionalProperties: false
        properties:
          start_datetime:
            type: string
          end_datetime:
            type: string
          requires_previous_forecast_step:
            type: boolean
          include_year_month_subdirectory:
            type: boolean
          data_root:
            type: string
            format: uri
          config:
            oneOf:
              - type: "null"
              - $ref: bblocks://ogc.api.processes.v1.schemas.link
              - $ref: bblocks://ogc.api.processes.v1.schemas.qualifiedInputValue
  rawProcessDescription:
    $ref: bblocks://ogc.api.processes.v1.schemas.process
  applicationPackage:
    $ref: bblocks://ogc.api.processes.v2.schemas.ogcapppkg
  processTypeEntry:
    $ref: bblocks://ospd.process-profiles.process-type
  w3cProvJson:
    $ref: bblocks://ogc.ogc-utils.prov.w3c-prov-json
  cwlProvExpandedJsonLd:
    description: Expanded JSON-LD named bundles. RDF semantics are checked with the imported SHACL shapes.
    type: array
    minItems: 1
    items:
      type: object
      required: ["@graph"]
      properties:
        "@id":
          type: string
        "@graph":
          type: array
          items:
            type: object
